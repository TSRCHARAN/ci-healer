[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-healer"
version = "0.1.0"
description = "A self-healing CI agent for GitHub Actions: classify failures, retry smartly, open fix PRs for trivial breaks."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "anthropic>=0.75",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ci-healer = "ci_healer.cli:main"

# src/ layout: the importable package lives in src/ci_healer, so running Python from the
# repo root can never accidentally import a same-named folder instead of the installed package.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
